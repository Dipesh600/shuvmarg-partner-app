name: shuvmarg_partner_app
description: "Shuvmarg Agent & Conductor Partner App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # ── Navigation ────────────────────────────────────────────────
  go_router: ^14.8.1

  # ── State Management ──────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ── Network ───────────────────────────────────────────────────
  dio: ^5.8.0+1
  retrofit: ^4.4.2
  http: ^1.2.2
  http_parser: ^4.1.2
  mime: ^2.0.0

  # ── Local Storage ─────────────────────────────────────────────
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # ── Image Handling ────────────────────────────────────────────
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # ── UI Helpers ────────────────────────────────────────────────
  # NOTE: google_fonts was removed here. Both faces (Manrope, Neue Machina) are
  # bundled under assets/fonts/ and declared below, so nothing fetches a font at
  # runtime. Re-adding it would reintroduce a network dependency for text.
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0
  pinput: ^5.0.0
  intl: ^0.20.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  qr_flutter: ^4.1.0

  # ── File / Document ───────────────────────────────────────────
  file_picker: ^8.3.7

  # ── Utils ─────────────────────────────────────────────────────
  equatable: ^2.0.7
  logger: ^2.5.0
  connectivity_plus: ^6.1.4
  permission_handler: ^11.3.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5
  retrofit_generator: ^9.1.5
  json_serializable: ^6.9.5
  json_annotation: ^4.9.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # Both faces are bundled: no runtime font fetching in a release build.
  fonts:
    # Body / UI (`--font-sans`). One variable file whose wght axis spans
    # 200-800; the weight is chosen per style via FontVariation in
    # AppFonts.sans, NOT by asset matching, so no `weight:` key belongs here.
    # Converted losslessly from the agent web's own
    # public/fonts/Manrope-VariableFont_wght.woff2 (WOFF2 is just a compression
    # wrapper), so the letterforms are identical to the web's.
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf

    # Headings (`--font-display`). Static pair; each declared weight was
    # checked against that file's own OS/2 usWeightClass.
    - family: Neue Machina
      fonts:
        - asset: assets/fonts/NeueMachina-Light.otf
          weight: 300
        - asset: assets/fonts/NeueMachina-Regular.otf
          weight: 400

