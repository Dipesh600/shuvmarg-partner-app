name: shuvmarg_partner_app
description: "Shuvmarg Agent & Conductor Partner App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # ── Navigation ────────────────────────────────────────────────
  go_router: ^14.8.1

  # ── State Management ──────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ── Network ───────────────────────────────────────────────────
  dio: ^5.8.0+1
  retrofit: ^4.4.2
  http: ^1.2.2
  http_parser: ^4.1.2
  mime: ^2.0.0

  # ── Local Storage ─────────────────────────────────────────────
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # ── Image Handling ────────────────────────────────────────────
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # ── UI Helpers ────────────────────────────────────────────────
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0
  pinput: ^5.0.0
  intl: ^0.20.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  qr_flutter: ^4.1.0

  # ── File / Document ───────────────────────────────────────────
  file_picker: ^8.3.7

  # ── Utils ─────────────────────────────────────────────────────
  equatable: ^2.0.7
  logger: ^2.5.0
  connectivity_plus: ^6.1.4
  permission_handler: ^11.3.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5
  retrofit_generator: ^9.1.5
  json_serializable: ^6.9.5
  json_annotation: ^4.9.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # Headings (`--font-display` on the agent web). Weights are declared
  # explicitly and match each file's OS/2 usWeightClass.
  #
  # Manrope (`--font-sans`) is NOT bundled yet and is still fetched via
  # google_fonts at runtime. The .otf supplied for bundling turned out to be a
  # static Manrope ExtraLight (usWeightClass 200, no fvar axis) despite its
  # "VariableFont_wght" filename, and would have flattened the entire w300-w800
  # scale. See lib/core/design/app_typography.dart.
  fonts:
    - family: Neue Machina
      fonts:
        - asset: assets/fonts/NeueMachina-Light.otf
          weight: 300
        - asset: assets/fonts/NeueMachina-Regular.otf
          weight: 400

